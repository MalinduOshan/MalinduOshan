<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="pg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914"/>
      <stop offset="50%" stop-color="#0A1528"/>
      <stop offset="100%" stop-color="#030812"/>
    </linearGradient>
    <linearGradient id="phone-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1F38"/>
      <stop offset="100%" stop-color="#070E1A"/>
    </linearGradient>
    <linearGradient id="radar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.7" opacity="0.6"/>
    </pattern>
    
<style>
  @keyframes scanline { 0% { transform: translateY(0); opacity: 0.2; } 50% { opacity: 0.8; } 100% { transform: translateY(220px); opacity: 0.2; } }
  @keyframes pulse { 0%, 100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
  @keyframes radar { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes laser { 0% { transform: translateY(0); } 50% { transform: translateY(90px); } 100% { transform: translateY(0); } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes dash { to { stroke-dashoffset: 0; } }
  .radar-ray { transform-origin: 475px 165px; animation: radar 5s linear infinite; }
  .scan-beam { animation: scanline 3.5s ease-in-out infinite; }
  .laser-bar { animation: laser 2.8s ease-in-out infinite; }
  /* Keep the translated mockup fixed so animation cannot overwrite its layout position. */
  .floating-app { animation: none; }
  .pulse-glow { animation: pulse 2s ease-in-out infinite; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, monospace; }
  .mono { font-family: "Consolas", "Courier New", monospace; }
</style>

  </defs>

  <!-- Base Card -->
  <rect width="600" height="340" rx="16" fill="url(#pg-bg)" stroke="#1E293B" stroke-width="1.6"/>
  <rect width="600" height="340" rx="16" fill="url(#grid)"/>

  <!-- Background Animated Cyber Glow in Top-Right -->
  <circle cx="480" cy="140" r="140" fill="#00F2FE" opacity="0.06" filter="blur(40px)"/>

  <!-- RIGHT SIDE: Mobile App Mockup + Radar -->
  <!-- Rotating Radar behind app -->
  <g class="radar-ray">
    <circle cx="475" cy="165" r="95" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="475" cy="165" r="60" fill="none" stroke="#0369A1" stroke-width="1" opacity="0.4"/>
    <path d="M 475 165 L 565 135 A 95 95 0 0 0 475 70 Z" fill="url(#radar-grad)"/>
    <line x1="475" y1="165" x2="565" y2="135" stroke="#00F2FE" stroke-width="1.4" opacity="0.8"/>
  </g>

  <!-- Floating Smartphone App Mockup -->
  <g class="floating-app" transform="translate(390, 50)">
    <!-- Phone Bezel -->
    <rect width="170" height="235" rx="20" fill="url(#phone-grad)" stroke="#38BDF8" stroke-width="1.8" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.7))"/>
    <!-- Speaker & Camera notch -->
    <rect x="55" y="8" width="60" height="4" rx="2" fill="#1E293B"/>
    
    <!-- Phone Screen Content -->
    <!-- App Header -->
    <text x="85" y="32" font-size="10" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="1">PHISHGUARD</text>
    
    <!-- Simulated URL Input Box -->
    <rect x="15" y="44" width="140" height="28" rx="6" fill="#070D18" stroke="#0284C7" stroke-width="1"/>
    <text x="24" y="62" class="mono" font-size="8.5" fill="#38BDF8">https://secure.lk</text>
    
    <!-- Security Shield Graphic on Screen -->
    <g transform="translate(85, 115)">
      <circle cx="0" cy="0" r="28" fill="#032B3A" stroke="#00F2FE" stroke-width="1.2" opacity="0.6"/>
      <path d="M 0 -18 L 16 -8 C 16 10, 8 20, 0 24 C -8 20, -16 10, -16 -8 Z" fill="#0284C7" opacity="0.4"/>
      <path d="M 0 -18 L 16 -8 C 16 10, 8 20, 0 24 C -8 20, -16 10, -16 -8 Z" fill="none" stroke="#00F2FE" stroke-width="1.8"/>
      <path d="M -6 0 L -2 4 L 7 -5" fill="none" stroke="#00F2FE" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Scan Status Pill -->
    <rect x="22" y="160" width="126" height="24" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <circle cx="34" cy="172" r="3.5" fill="#34D399" class="pulse-glow"/>
    <text x="44" y="176" class="mono" font-size="8.5" font-weight="700" fill="#6EE7B7">THREAT: 0% CLEAN</text>

    <!-- VirusTotal / Threat API node badges -->
    <rect x="15" y="196" width="66" height="18" rx="4" fill="#0F172A" stroke="#334155" stroke-width="0.7"/>
    <text x="48" y="208.5" class="mono" font-size="7.5" fill="#94A3B8" text-anchor="middle">VirusTotal</text>
    
    <rect x="87" y="196" width="68" height="18" rx="4" fill="#0F172A" stroke="#334155" stroke-width="0.7"/>
    <text x="121" y="208.5" class="mono" font-size="7.5" fill="#94A3B8" text-anchor="middle">URLhaus API</text>
  </g>

  <!-- Laser Scan Beam Moving Across Card -->
  <line x1="25" y1="0" x2="575" y2="0" stroke="#00F2FE" stroke-width="1.2" opacity="0.7" class="scan-beam" filter="drop-shadow(0 0 6px #00F2FE)"/>

  <!-- LEFT SIDE: Project Details -->
  <!-- Category Pill -->
  <g transform="translate(36, 36)">
    <rect width="192" height="26" rx="6" fill="#082032" stroke="#0284C7" stroke-width="1"/>
    <circle cx="14" cy="13" r="4.5" fill="#00F2FE" class="pulse-glow"/>
    <text x="26" y="17.5" class="mono" font-size="10.5" font-weight="700" fill="#38BDF8" letter-spacing="1.2">01 // CYBER DEFENSE</text>
  </g>

  <!-- Project Name & Tagline -->
  <text x="36" y="112" font-size="32" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">PhishGuard</text>
  <text x="36" y="136" font-size="12.5" font-weight="700" fill="#00F2FE" letter-spacing="1">REAL-TIME PHISHING &amp; DOMAIN DETECTOR</text>

  <!-- Description lines -->
  <text x="36" y="172" font-size="13" fill="#94A3B8">Automated cybersecurity platform scanning URLs</text>
  <text x="36" y="192" font-size="13" fill="#94A3B8">against live threat feeds, VirusTotal, and URLhaus.</text>
  <text x="36" y="212" font-size="13" fill="#94A3B8">Features heuristic risk scoring &amp; user awareness.</text>

  <!-- Live Verified Badge -->
  <g transform="translate(36, 234)">
    <rect width="168" height="26" rx="5" fill="#0B1C2D" stroke="#0284C7" stroke-width="0.9"/>
    <text x="12" y="17" class="mono" font-size="10" font-weight="600" fill="#38BDF8">🛡️ HEURISTIC SECURITY SCAN</text>
  </g>

  <!-- Tech Stack Pills -->
  <g transform="translate(36, 282)">
    <rect x="0" y="0" width="86" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <text x="43" y="16" class="mono" font-size="10" fill="#E2E8F0" text-anchor="middle">React Native</text>

    <rect x="94" y="0" width="76" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <text x="132" y="16" class="mono" font-size="10" fill="#E2E8F0" text-anchor="middle">TypeScript</text>

    <rect x="178" y="0" width="124" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <text x="240" y="16" class="mono" font-size="10" fill="#E2E8F0" text-anchor="middle">Cloudflare Worker</text>

    <rect x="310" y="0" width="68" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <text x="344" y="16" class="mono" font-size="10" fill="#E2E8F0" text-anchor="middle">Firebase</text>
  </g>
</svg>