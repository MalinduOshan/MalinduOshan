<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00ffa3"/><stop offset=".5" stop-color="#00d4ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<radialGradient id="r"><stop offset="0" stop-color="#1b2a55"/><stop offset="1" stop-color="#0a0f1a"/></radialGradient></defs>
<style>.t{font:700 62px 'Segoe UI',Arial,sans-serif;fill:url(#g)}.s{font:12px 'Courier New',monospace;fill:#6b7f99;letter-spacing:4px}
.u{font:17px 'Courier New',monospace;fill:#9fb3c8}.pill{font:12px 'Courier New',monospace;fill:#9fb3c8}
.st{animation:tw 3s ease-in-out infinite}.st2{animation:tw 4s ease-in-out infinite 1s}@keyframes tw{50%{opacity:.15}}
.fl{animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}</style>
<rect width="1000" height="260" rx="16" fill="url(#r)"/>
<g fill="#fff"><circle class="st" cx="120" cy="60" r="1.5"/><circle class="st2" cx="300" cy="40" r="1.2"/><circle class="st" cx="560" cy="30" r="1.5"/><circle class="st2" cx="760" cy="55" r="1.2"/><circle class="st" cx="880" cy="210" r="1.5"/><circle class="st2" cx="200" cy="220" r="1.2"/><circle class="st" cx="650" cy="225" r="1.5"/></g>
<g class="fl" fill="none" stroke="#00d4ff" stroke-width="2" opacity=".7"><path d="M70 120l-25 18 25 18M100 120l25 18-25 18"/></g>
<g class="fl" fill="none" stroke="#a78bfa" stroke-width="2" opacity=".7" style="animation-delay:2s"><path d="M910 110l30 15v34l-30 15-30-15v-34zM880 125l30 15 30-15M910 140v34"/></g>
<text x="500" y="62" text-anchor="middle" class="s">HELLO WORLD / I'M</text>
<text x="500" y="135" text-anchor="middle" class="t">MALINDU OSHAN</text>
<text x="500" y="172" text-anchor="middle" class="u">Code with purpose. Build with curiosity.</text>
<rect x="385" y="196" width="230" height="26" rx="13" fill="#0a0f1a" stroke="#1d2a44"/>
<circle cx="403" cy="209" r="3" fill="#00ffa3"/><text x="415" y="213" class="pill">SRI LANKA / BUILDING &amp; LEARNING</text>
