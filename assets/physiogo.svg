<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="pg2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070918"/>
      <stop offset="50%" stop-color="#0E172E"/>
      <stop offset="100%" stop-color="#070919"/>
    </linearGradient>
    <linearGradient id="card-ecg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="ecg-dot-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#4338CA" opacity="0.35"/>
    </pattern>
    
<style>
  @keyframes scanline { 0% { transform: translateY(0); opacity: 0.2; } 50% { opacity: 0.8; } 100% { transform: translateY(220px); opacity: 0.2; } }
  @keyframes pulse { 0%, 100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
  @keyframes radar { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes laser { 0% { transform: translateY(0); } 50% { transform: translateY(90px); } 100% { transform: translateY(0); } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes dash { to { stroke-dashoffset: 0; } }
  .radar-ray { transform-origin: 475px 165px; animation: radar 5s linear infinite; }
  .scan-beam { animation: scanline 3.5s ease-in-out infinite; }
  .laser-bar { animation: laser 2.8s ease-in-out infinite; }
  .floating-app { animation: none; }
  .pulse-glow { animation: pulse 2s ease-in-out infinite; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, monospace; }
  .mono { font-family: "Consolas", "Courier New", monospace; }
</style>

  </defs>

  <rect width="600" height="340" rx="16" fill="url(#pg2-bg)" stroke="#1E293B" stroke-width="1.6"/>
  <rect width="600" height="340" rx="16" fill="url(#ecg-dot-grid)"/>

  <!-- Background Animated Pulse Aura -->
  <circle cx="480" cy="140" r="130" fill="#818CF8" opacity="0.08" filter="blur(45px)"/>

  <!-- Continuous Flowing ECG Heartbeat Track across Card -->
  <path d="M 0 215 H 240 L 255 185 L 268 245 L 282 175 L 295 215 H 600" fill="none" stroke="url(#card-ecg)" stroke-width="2" stroke-dasharray="600" stroke-dashoffset="600" class="pulse-flow" opacity="0.8" style="animation: dash 3.5s linear infinite;"/>

  <!-- RIGHT SIDE: Clinical Schedule App Mockup -->
  <g class="floating-app" transform="translate(390, 50)">
    <!-- App Frame / Tablet -->
    <rect width="170" height="235" rx="18" fill="#0B132B" stroke="#6366F1" stroke-width="1.8" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.7))"/>
    
    <!-- App Bar -->
    <rect x="0" y="0" width="170" height="32" rx="18" fill="#1E1B4B" opacity="0.8"/>
    <text x="85" y="21" font-size="10.5" font-weight="700" fill="#C084FC" text-anchor="middle" letter-spacing="1">PHYSIOGO APP</text>
    
    <!-- Patient Card 1 -->
    <rect x="12" y="42" width="146" height="52" rx="8" fill="#141E3C" stroke="#334155" stroke-width="0.8"/>
    <circle cx="28" cy="62" r="10" fill="#4338CA"/>
    <text x="28" y="66" class="mono" font-size="9" fill="#E0E7FF" text-anchor="middle">PT</text>
    <text x="46" y="58" font-size="9.5" font-weight="700" fill="#F8FAFC">Patient Session</text>
    <text x="46" y="72" class="mono" font-size="8" fill="#38BDF8">Rehab Stage 2 · 10:30 AM</text>
    <text x="46" y="84" class="mono" font-size="7.5" fill="#10B981">✓ Confirmed</text>

    <!-- Interactive Progress Ring -->
    <g transform="translate(85, 142)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1E293B" stroke-width="5"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#818CF8" stroke-width="5" stroke-dasharray="200" stroke-dashoffset="45" stroke-linecap="round"/>
      <text x="0" y="4" class="mono" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">85%</text>
      <text x="0" y="16" class="mono" font-size="6.5" fill="#94A3B8" text-anchor="middle">MOBILITY</text>
    </g>

    <!-- Clinic Workflow Indicator -->
    <rect x="12" y="190" width="146" height="24" rx="6" fill="#1E1B4B" stroke="#6366F1" stroke-width="0.8"/>
    <circle cx="24" cy="202" r="3.5" fill="#818CF8" class="pulse-glow"/>
    <text x="34" y="206" class="mono" font-size="8.5" font-weight="600" fill="#C084FC">WORKFLOW: OPTIMIZED</text>
  </g>

  <!-- LEFT SIDE: Project Content -->
  <!-- Category Pill -->
  <g transform="translate(36, 36)">
    <rect width="215" height="26" rx="6" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
    <circle cx="14" cy="13" r="4.5" fill="#A78BFA" class="pulse-glow"/>
    <text x="26" y="17.5" class="mono" font-size="10.5" font-weight="700" fill="#C084FC" letter-spacing="1.2">02 // CLINICAL WORKFLOW</text>
  </g>

  <!-- Titles -->
  <text x="36" y="112" font-size="32" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">PhysioGo</text>
  <text x="36" y="136" font-size="12.5" font-weight="700" fill="#818CF8" letter-spacing="1">CLINIC APPOINTMENT &amp; PATIENT REHAB SUITE</text>

  <!-- Descriptions -->
  <text x="36" y="172" font-size="13" fill="#94A3B8">Tailored mobile clinical solution designed for physiotherapy</text>
  <text x="36" y="192" font-size="13" fill="#94A3B8">scheduling, session progression tracking, patient exercise</text>
  <text x="36" y="212" font-size="13" fill="#94A3B8">plans, and administrative operations.</text>

  <!-- Status Badge -->
  <g transform="translate(36, 234)">
    <rect width="180" height="26" rx="5" fill="#181434" stroke="#4338CA" stroke-width="0.9"/>
    <text x="12" y="17" class="mono" font-size="10" font-weight="600" fill="#A78BFA">🩺 IN ACTIVE DEVELOPMENT</text>
  </g>

  <!-- Tech Stack Pills -->
  <g transform="translate(36, 282)">
    <rect x="0" y="0" width="86" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <text x="43" y="16" class="mono" font-size="10" fill="#E2E8F0" text-anchor="middle">React Native</text>

    <rect x="94" y="0" width="56" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <text x="122" y="16" class="mono" font-size="10" fill="#E2E8F0" text-anchor="middle">Expo</text>

    <rect x="158" y="0" width="76" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <text x="196" y="16" class="mono" font-size="10" fill="#E2E8F0" text-anchor="middle">TypeScript</text>

    <rect x="242" y="0" width="138" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <text x="311" y="16" class="mono" font-size="10" fill="#E2E8F0" text-anchor="middle">Healthcare Workflows</text>
  </g>
</svg>