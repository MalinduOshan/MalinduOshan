<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Malindu Oshan — README Preview</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { margin: 0; background: #0d1117; color: #e6edf3; font: 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { max-width: 1012px; margin: 0 auto; padding: 32px; background: #0d1117; }
    a { color: #58a6ff; } img { max-width: 100%; } table { width: 100%; border-collapse: collapse; } td { padding: 12px; vertical-align: top; }
    code, pre { background: #161b22; } blockquote { border-left: 4px solid #30363d; padding-left: 16px; }
  </style>
</head>
<body><main id="readme">Loading README preview…</main>
<script>
fetch('/README.md').then(response => response.text()).then(markdown => {
  document.getElementById('readme').innerHTML = marked.parse(markdown);
});
</script>
</body>
</html>
